<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickChat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="loginScreen" class="screen">

        <div class="login-box">

            <h1>QuickChat</h1>

            <p>
                이름만 입력하고<br>
                바로 대화하세요.
            </p>

            <input
                id="nameInput"
                type="text"
                maxlength="20"
                placeholder="이름"
                autocomplete="off"
            >

            <button id="joinButton">
                입장하기
            </button>

            <div id="status">
                준비 중...
            </div>

        </div>

    </div>


    <div id="chatScreen" class="chat-screen hidden">

        <header>

            <strong>QuickChat</strong>

            <span id="onlineCount">
                연결 중...
            </span>

        </header>


        <main id="messages"></main>


        <form id="messageForm">

            <input
                id="messageInput"
                type="text"
                maxlength="500"
                placeholder="메시지를 입력하세요..."
                autocomplete="off"
            >

            <button type="submit">
                ➤
            </button>

        </form>

    </div>


    <script type="module" src="app.js"></script>

</body>
</html>
