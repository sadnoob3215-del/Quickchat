<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickChat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 이름 입력 화면 -->
    <div id="loginScreen" class="screen">
        <div class="login-box">

            <h1>QuickChat</h1>
            <p>이름만 입력하고 바로 대화하세요.</p>

            <input
                id="nameInput"
                type="text"
                maxlength="20"
                placeholder="이름 입력"
                autocomplete="off"
            >

            <button id="joinButton">
                입장하기
            </button>

        </div>
    </div>


    <!-- 채팅 화면 -->
    <div id="chatScreen" class="chat-screen hidden">

        <header>
            <div>
                <strong>QuickChat</strong>
                <span id="userName"></span>
            </div>
        </header>

        <main id="messages"></main>

        <form id="messageForm">

            <input
                id="messageInput"
                type="text"
                maxlength="500"
                placeholder="메시지를 입력하세요..."
                autocomplete="off"
            >

            <button type="submit">
                ➤
            </button>

        </form>

    </div>


    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>

</body>
</html>
